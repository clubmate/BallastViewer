name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the version is the commit count

      - name: Select newest Xcode
        # Must match the local toolchain (Xcode 26 / Swift 6.2); older
        # compilers reject some of the strict-concurrency code.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Metal toolchain
        # U49: MLX compiles Metal shaders at build time; Xcode 26 ships the
        # Metal compiler as a separate component. No-op when present; a
        # failure here must fail the build visibly, not later and cryptically.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Version from commit count
        id: version
        run: |
          N=$(git rev-list --count HEAD)
          echo "number=$N" >> "$GITHUB_OUTPUT"
          echo "tag=v0.1.$N" >> "$GITHUB_OUTPUT"

      - name: Release notes from commits since the last release
        id: notes
        # One bullet per commit subject since the previous release tag
        # (oldest first). --exclude keeps a re-run of this workflow from
        # comparing against its own tag and producing empty notes.
        run: |
          PREV=$(git describe --tags --abbrev=0 --exclude "${{ steps.version.outputs.tag }}" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          echo "Previous release: ${PREV:-none} — range: $RANGE"
          {
            echo "notes<<NOTES_EOF"
            git log "$RANGE" --no-merges --reverse --pretty=format:'- %s'
            echo ""
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project BallastViewer.xcodeproj \
            -scheme BallastViewer \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="0.1.${{ steps.version.outputs.number }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            -quiet build

      - name: Zip app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent BallastViewer.app \
            "$GITHUB_WORKSPACE/BallastViewer-${{ steps.version.outputs.tag }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BallastViewer ${{ steps.version.outputs.tag }}
          files: BallastViewer-${{ steps.version.outputs.tag }}.zip
          body: |
            ## What's new

            ${{ steps.notes.outputs.notes }}
