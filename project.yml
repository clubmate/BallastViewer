name: BallastViewer
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  BallastCore:
    path: BallastCore
  # U49: on-device vision-language models (Apple Silicon only — MLX is Metal).
  # Pinned EXACTLY: the xcodeproj (and its Package.resolved) is generated and
  # gitignored, so CI resolves fresh on every push — a range would let an
  # upstream release change the build without any commit here.
  # U57: pinned to a `main` COMMIT (2026-07-15) — the prompt-prefix cache
  # needs Qwen3.5's warm continuation (`prepareContinuation`: M-RoPE anchored
  # after a cached prefix, #399, plus #419: prefill state kept by the
  # TokenIterator) that no tagged release carries yet. This is the LAST
  # commit before upstream started calling mlx-swift ≥ 0.31.5 API (#369),
  # and those mlx-swift releases need Swift 6.3 / Xcode 27 — neither here
  # nor in CI. Go back to `exactVersion` with the first release that carries
  # #399 — and check the Xcode floor first.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: d2424294a6c3bbd0de37a0761d80efc05e6813dd
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.10.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
targets:
  BallastViewer:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: BallastCore
      - package: mlx-swift-lm
        products: [MLXVLM, MLXLMCommon]
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: BallastViewer Library
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.bolliboll.ballastviewer.library
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bolliboll.ballastviewer.library
            UTTypeDescription: BallastViewer Library
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - ballastlib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bolliboll.ballastviewer
        PRODUCT_NAME: BallastViewer
        # Overridden by scripts/build.sh with the git commit count.
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # U49: MLX runs on Metal — Apple Silicon only, no Intel slice.
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
