<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BALLAST.VIEWER</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="photos">
  <div id="left">
    <img id="leftPhoto" src="">
  </div>
  <div id="right">
    <img id="rightPhoto" src="">
  </div>
</div>

<div id="canvas"><div id="grid"></div></div>

<div id="sidebarLeft">
  <button id="rate">RATE PHOTOS</button>
  <button id="ranking">RANKING</button>
</div>


<div id="sidebarRight">
  <div id="previewContainer">
  <div id="previewContainerLeft">
    <img id="previewLeftPhoto" src="">
    <div id="leftStats"><div class="name"></div><div class="chance"></div><div class="score"></div></div>
  </div>
  <div id="previewContainerRight">
    <img id="previewRightPhoto" src="">
    <div id="rightStats"><div class="name"></div><div class="chance"></div><div class="score"></div></div>
  </div>
  </div>

  
  <div id="completeTable"><table></table></div>
  <div id="roundStats">
    <table></table>
    <div id="round"></div>
    <div id="roundAccuracy"></div>
  </div>

  <div id="buttons">
    <button id="download">SAVE JSON</button>
    <button id="fullscreen">FS</button>
  </div>
</div>

<script src="jquery-3.5.1.min.js"></script>
<script src="scripts.js"></script>
  
</body>
</html>
